name: Parking regression tests

on:
  push:
    branches:
      - codex/parking-review-fixes
  pull_request:
    paths:
      - "src/**"
      - "scripts/fill_access_schedule.py"
      - "tests/**"
      - ".github/workflows/parking-regressions.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: python -m pip install numpy pandas
      - name: Validate changed Python modules
        run: python -m compileall -q src scripts/fill_access_schedule.py tests/test_review_regressions.py
      - name: Run access and prediction regressions
        run: python -m unittest discover -s tests -p test_review_regressions.py -v
      - name: Run existing request polling tests
        run: python -m unittest discover -s tests -p test_request_polling.py -v
